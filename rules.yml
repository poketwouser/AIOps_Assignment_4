# Recording + alerting rules. Format follows DA3408/Monitoring/sample_rules.yml.
#
# AI attribution (required by the A4 brief): the PromQL in this file was generated by
# Claude (Anthropic). Prompt: "write Prometheus recording rules and alerts for the A4
# captioning app: app down, node_exporter down, high host CPU, high p95 inference
# latency and failed images". Thresholds were then set from the measured runs
# (bulk ZIPs push host CPU to ~53%, so HostCPUHigh is at 40%).
groups:
  - name: recording
    rules:
      # Same rule as the course sample: CPU cores busy in user and system mode.
      - record: cpu_util
        expr: sum by (mode) (rate(node_cpu_seconds_total{mode=~"system|user"}[1m]))

      # Host CPU busy %, all cores averaged: 1 - idle fraction.
      - record: node:cpu_busy:percent
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[1m])))

      - record: caption:images_per_second:rate1m
        expr: sum by (mode) (rate(caption_images_processed_total{status="ok"}[1m]))

      # p95 from the histogram buckets, per mode.
      - record: caption:inference_p95_seconds:1m
        expr: histogram_quantile(0.95, sum by (le, mode) (rate(caption_inference_seconds_bucket[1m])))

  - name: caption-alerts
    rules:
      - alert: CaptionAppDown
        expr: up{job="caption_app"} == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "Captioning app is not answering on :18000"

      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "node_exporter is down, no host metrics"

      - alert: HostCPUHigh
        expr: node:cpu_busy:percent > 40
        for: 20s
        labels:
          severity: warning
        annotations:
          summary: "Host CPU above 40% for 20 s ({{ $value | printf \"%.0f\" }}%)"

      - alert: CaptionLatencyHigh
        expr: caption:inference_p95_seconds:1m > 3
        for: 30s
        labels:
          severity: warning
          component: caption_app
        annotations:
          summary: "p95 inference time above 3 s ({{ $value | printf \"%.2f\" }} s)"

      - alert: CaptionErrors
        expr: sum(increase(caption_errors_total[1m])) > 0
        labels:
          severity: warning
          component: caption_app
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} failed images/uploads in the last minute"
